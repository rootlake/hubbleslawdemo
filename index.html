<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubble's Law Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #ui { position: fixed; top: 12px; left: 12px; background: rgba(8,4,4,.85); border: 1px solid #5a1d1a; padding: 10px 14px; border-radius: 8px; width: 260px; }
  #ui input { accent-color: #c0392b; }
  #ui label { display: block; margin: 6px 0; }
  #ui input[type=range] { width: 100%; }
  #ui [hidden] { display: none; }
  #ui p { margin: 0 0 6px; font-size: 12px; color: #aaa; }
  #reset { width: 100%; margin-top: 6px; padding: 6px; background: #1a0a09; color: #f0d6d3; border: 1px solid #a8322b; border-radius: 6px; cursor: pointer; font: inherit; }
  #reset:hover { background: #a8322b; }
  #ui .credit { margin: 8px 0 0; font-size: 10px; color: #777; }
  #hide { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #aaa; cursor: pointer; font-size: 12px; }
  #hide:hover { color: #fff; }
  #ui[hidden], #show[hidden] { display: none; }
  #show { position: fixed; top: 12px; left: 12px; background: rgba(8,4,4,.7); color: #e8b4ae; border: 1px solid #a8322b; border-radius: 6px; padding: 6px 10px; cursor: pointer; opacity: .5; }
  #show:hover { opacity: 1; }
  .seg { display: flex; margin: 8px 0; border: 1px solid #a8322b; border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; padding: 6px; background: transparent; color: #bbb; border: 0; cursor: pointer; font: inherit; }
  .seg button.on { background: #c0392b; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="show" hidden title="Show controls (H)">☰ Controls</button>
<div id="ui">
  <button id="hide" title="Hide (H)">Hide ✕</button>
  <p>Click a galaxy to make it home.<br>H hides this panel.</p>
  <div class="seg" id="mode"><button class="on" data-mode="hubble">Hubble</button><button data-mode="ellipses">Simple</button></div>
  <label id="densityRow" hidden>Density <input id="density" type="range" min="40" max="450" step="10" value="250"></label>
  <label>Layers <span id="nv"></span><input id="layers" type="range" min="1" max="7" step="1" value="5"></label>
  <label>Expansion per layer <input id="scale" type="range" min="0" max="0.06" step="0.002" value="0.02"></label>
  <label>Redshift tint <input id="tint" type="range" min="0" max="1" step="0.05" value="0.6"></label>
  <label><input id="arrows" type="checkbox"> Velocity arrows</label>
  <label><input id="anim" type="checkbox"> Animate expansion</label>
  <button id="reset" title="Back to the start: home at center, expansion waiting for a click">Reset</button>
  <p class="credit" id="credit">Hubble Ultra Deep Field — NASA, ESA, S. Beckwith (STScI) &amp; the HUDF Team</p>
</div>

, [0.1561, 0.2537, 0.005], [0.3172, 0.5199, 0.0038], [0.5762, 0.9916, 0.0042], [0.635, 0.2753, 0.0037], [0.3374, 0.7839, 0.0042], [0.232, 0.5333, 0.004], [0.501, 0.2583, 0.0036], [0.4753, 0.1715, 0.0038], [0.2234, 0.0791, 0.0039], [0.3773, 0.2678, 0.0038], [0.4139, 0.4985, 0.0039], [0.2595, 0.076, 0.0036], [0.114, 0.1884, 0.0036], [0.7312, 0.4613, 0.0035], [0.6008, 0.8673, 0.0038], [0.5055, 0.465, 0.0035], [0.9407, 0.893, 0.0036], [0.3783, 0.0277, 0.0036], [0.4437, 0.5724, 0.0041], [0.7905, 0.3064, 0.0039], [0.3861, 0.196, 0.004], [0.4611, 0.0389, 0.0036], [0.1735, 0.1753, 0.0037], [0.9624, 0.0562, 0.0037], [0.2125, 0.7619, 0.0037], [0.0632, 0.0054, 0.0036], [0.4253, 0.1984, 0.0037], [0.5169, 0.664, 0.0038], [0.078, 0.8456, 0.0039], [0.8487, 0.7604, 0.0036], [0.7462, 0.6803, 0.0041], [0.349, 0.4711, 0.0039], [0.7391, 0.5006, 0.0035], [0.7841, 0.4336, 0.0036], [0.7749, 0.3185, 0.0035], [0.0765, 0.6183, 0.0034], [0.891, 0.314, 0.0036], [0.8461, 0.6282, 0.0033], [0.4661, 0.1291, 0.0034], [0.4613, 0.4405, 0.0036], [0.6997, 0.6682, 0.0037], [0.9371, 0.3396, 0.0039], [0.5964, 0.6914, 0.0036], [0.6752, 0.3597, 0.0036], [0.8997, 0.2557, 0.0032], [0.5213, 0.4859, 0.0037], [0.3679, 0.1169, 0.0032], [0.5214, 0.2107, 0.0035], [0.5379, 0.916, 0.0032], [0.6147, 0.8063, 0.0033], [0.988, 0.1824, 0.0033], [0.4656, 0.9401, 0.0038], [0.4036, 0.8057, 0.0031], [0.931, 0.5272, 0.0032], [0.0797, 0.6773, 0.0033], [0.012, 0.8736, 0.0038], [0.1486, 0.644, 0.0036], [0.2315, 0.1329, 0.0034], [0.8761, 0.9974, 0.0032], [0.6144, 0.2746, 0.003], [0.7089, 0.2402, 0.0035], [0.2917, 0.9064, 0.0034], [0.8129, 0.2883, 0.0031], [0.0978, 0.1845, 0.0034], [0.1134, 0.1739, 0.0034], [0.0986, 0.5893, 0.0032], [0.596, 0.9535, 0.0036], [0.49, 0.6169, 0.003], [0.2084, 0.2309, 0.0033], [0.4802, 0.1316, 0.0035], [0.2688, 0.08, 0.0036], [0.2898, 0.3656, 0.0036], [0.1605, 0.997, 0.0032], [0.635, 0.6762, 0.003], [0.778, 0.0014, 0.0029], [0.3886, 0.4861, 0.0037], [0.5914, 0.9941, 0.0037], [0.3027, 0.2472, 0.0032], [0.458, 0.6288, 0.0033], [0.3034, 0.2768, 0.0033], [0.2552, 0.88, 0.0031], [0.2535, 0.6348, 0.003], [0.8386, 0.5055, 0.003], [0.68, 0.0364, 0.0031], [0.3136, 0.1767, 0.0032], [0.3615, 0.0478, 0.0032], [0.7015, 0.0215, 0.0034], [0.0086, 0.0396, 0.0032], [0.6905, 0.0443, 0.0032], [0.3275, 0.626, 0.0033], [0.961, 0.0954, 0.0033], [0.0873, 0.3437, 0.0031], [0.9918, 0.7413, 0.0034], [0.0315, 0.8533, 0.0031], [0.5127, 0.5463, 0.003]];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const img = new Image(); img.src = 'hudf.jpg';
let W, H, S, ox, oy, center, home;
let field = img, gal = HUDF_GAL;  // whatever gets layered, and its clickable galaxies
// Each new home runs a fresh demo: cut to a single stacked image (reveal = 0), then expand (0→1)
let reveal = 0, held = true, lastT = 0;  // held: stay stacked until a click
const goHome = g => { home = g; reveal = 0; };

// Ellipses mode: paint random ellipses into a square canvas that stands in for the photo
function makeEllipses(n) {
  const N = 2048, c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = c.height = N;
  g.fillStyle = '#ebebeb';
  const list = Array.from({ length: n }, () => {
    const x = Math.random(), y = Math.random(), r = (6 + Math.random() ** 2 * 24) / N;
    g.beginPath();
    g.ellipse(x * N, y * N, r * N, r * N * (0.3 + Math.random() * 0.7), Math.random() * Math.PI, 0, Math.PI * 2);
    g.fill();
    return [x, y, r];
  });
  return [c, list];
}
function setMode() {
  const ell = $('mode').querySelector('.on').dataset.mode === 'ellipses';
  $('densityRow').hidden = !ell;
  $('credit').hidden = ell;
  [field, gal] = ell ? makeEllipses(+$('density').value) : [img, HUDF_GAL];
  goHome(nearest(center.x, center.y));
}
$('density').oninput = setMode;
$('mode').onclick = e => {
  if (!e.target.dataset.mode) return;
  for (const b of $('mode').children) b.classList.toggle('on', b === e.target);
  setMode();
};

function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.max(W, H); ox = (W - S) / 2; oy = (H - S) / 2;  // cover-fit the square image
}
const pos = g => ({ x: ox + g[0] * S, y: oy + g[1] * S });
const nearest = (x, y) => gal.reduce((a, g) => {
  const p = pos(g), q = pos(a);
  return Math.hypot(p.x - x, p.y - y) < Math.hypot(q.x - x, q.y - y) ? g : a;
});

// Layer i is the whole field scaled by s = 1 + i·k about `center`: p' = c + s(p - c).
// Every galaxy shifts by i·k·(p - c), i.e. proportional to its distance from home: Hubble's law.
function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  center = pos(home);
  if (!held) reveal = Math.min(1, reveal + dt / 2);
  const ease = reveal * reveal * (3 - 2 * reveal);  // smoothstep
  const n = +$('layers').value;
  let k = +$('scale').value * ease;
  if ($('anim').checked) k *= (1 - Math.cos(t / 1200)) / 2;
  $('nv').textContent = n;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (field !== img || img.complete) {
    ctx.globalCompositeOperation = 'screen';  // black adds nothing, so layers stack like transparent clones
    for (let i = n - 1; i >= 0; i--) {
      const s = 1 + i * k;
      ctx.globalAlpha = i ? 0.75 * (1 - i / n) : 1;  // older-looking trail fades out
      ctx.drawImage(field, center.x + s * (ox - center.x), center.y + s * (oy - center.y), S * s, S * s);
    }
    ctx.globalAlpha = 1;
  }

  // Redshift overlay: multiply by white at home fading to red with distance
  const tint = +$('tint').value * ease, R = Math.hypot(W, H) * 0.6;
  const grad = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, R);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(1, `rgb(255,${255 * (1 - 0.8 * tint)},${255 * (1 - 0.95 * tint)})`);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  if ($('arrows').checked) {
    // arrow = shift from base layer to outermost layer; length grows with distance from home
    const d = (n - 1) * (+$('scale').value) * ease;
    ctx.lineWidth = 2;
    for (const g of gal.slice(0, 120)) {
      if (g === home) continue;
      const p = pos(g), dx = d * (p.x - center.x), dy = d * (p.y - center.y), L = Math.hypot(dx, dy);
      if (L < 2) continue;
      const f = Math.min(1, Math.hypot(p.x - center.x, p.y - center.y) / R);  // white near home → red far away
      ctx.strokeStyle = ctx.fillStyle = `rgb(255,${255 - 200 * f},${255 - 220 * f})`;
      const ux = dx / L, uy = dy / L, ex = p.x + dx, ey = p.y + dy;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex - 7 * ux - 4 * uy, ey - 7 * uy + 4 * ux); ctx.lineTo(ex - 7 * ux + 4 * uy, ey - 7 * uy - 4 * ux);
      ctx.fill();
    }
  }

  if (home) {
    const h = pos(home);
    ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(h.x, h.y, home[2] * S + 10, 0, Math.PI * 2); ctx.stroke();
  }
  requestAnimationFrame(frame);
}

cv.addEventListener('click', e => { held = false; goHome(nearest(e.clientX, e.clientY)); });

// Reset = page-load state: sliders back to their defaults, layers collapsed until the next click
$('reset').onclick = () => {
  for (const el of $('ui').querySelectorAll('input:not(#density)'))
    el.type === 'checkbox' ? el.checked = el.defaultChecked : el.value = el.defaultValue;
  held = true;
  goHome(nearest(W / 2, H / 2));
};

const toggleUI =() => { $('show').hidden = !($('ui').hidden = !$('ui').hidden); };
$('hide').onclick = $('show').onclick = toggleUI;
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') toggleUI(); });
addEventListener('resize', resize);

resize();
home = nearest(W / 2, H / 2);
requestAnimationFrame(frame);
</script>
</body>
</html>
